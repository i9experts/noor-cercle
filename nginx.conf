server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;

    # The portal lives at app.noorcircles.com. Old links to the Railway address
    # (bookmarks, earlier sign-in messages and emails) go to the same page there.
    if ($host ~* \.up\.railway\.app$) {
        return 301 https://app.noorcircles.com$request_uri;
    }

    # React Router — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The page itself is always re-checked, so a new release shows at once.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Cache static assets
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}
